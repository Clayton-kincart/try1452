<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=480,
               height=204,
               initial-scale=1.0">

<title>Oskaloosa Weather</title>


<style>

/* =====================================================
   OSKALOOSA, IOWA WEATHER

   DISPLAY:
   480 x 204 PIXELS

   DATA:
   Open-Meteo
   ===================================================== */


/* =====================================================
   BASIC RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

}


/* =====================================================
   WEATHER BACKGROUNDS
   ===================================================== */


/* CLEAR */

body.clear {

    background:
        linear-gradient(
            135deg,
            #0879c9 0%,
            #2fa8e8 50%,
            #82d5f5 100%
        );

}


/* PARTLY CLOUDY */

body.partly-cloudy {

    background:
        linear-gradient(
            135deg,
            #286fa5 0%,
            #5899bd 50%,
            #9fc4d3 100%
        );

}


/* CLOUDY */

body.cloudy {

    background:
        linear-gradient(
            135deg,
            #354858 0%,
            #526b7a 50%,
            #718695 100%
        );

}


/* RAIN */

body.rain {

    background:
        linear-gradient(
            135deg,
            #172936 0%,
            #31546b 50%,
            #4f7285 100%
        );

}


/* SNOW */

body.snow {

    background:
        linear-gradient(
            135deg,
            #7697ad 0%,
            #abc4d4 50%,
            #dce9ef 100%
        );

}


/* FOG */

body.fog {

    background:
        linear-gradient(
            135deg,
            #68767d 0%,
            #9ca9ad 50%,
            #cbd1d2 100%
        );

}


/* THUNDERSTORM */

body.storm {

    background:
        linear-gradient(
            135deg,
            #101522 0%,
            #27243f 50%,
            #493455 100%
        );

}


/* NIGHT */

body.night {

    background:
        linear-gradient(
            135deg,
            #020617 0%,
            #0b1b36 50%,
            #172554 100%
        );

}


/* =====================================================
   BODY
   ===================================================== */

body {

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    transition:
        background 2s ease;

}


/* =====================================================
   MAIN SCREEN
   ===================================================== */

.screen {

    width: 480px;
    height: 204px;

    padding: 7px 10px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    overflow: hidden;

}


/* =====================================================
   HEADER
   ===================================================== */

.header {

    height: 31px;

    display: flex;

    justify-content: space-between;

    align-items: center;

}


.location {

    font-size: 18px;

    font-weight: bold;

    line-height: 19px;

    white-space: nowrap;

    text-shadow:
        0 1px 3px
        rgba(0,0,0,0.35);

}


.date {

    font-size: 9px;

    line-height: 10px;

    color:
        rgba(255,255,255,0.85);

}


.time {

    font-size: 18px;

    font-weight: bold;

    white-space: nowrap;

    text-shadow:
        0 1px 3px
        rgba(0,0,0,0.35);

}


/* =====================================================
   CURRENT WEATHER
   ===================================================== */

.current {

    height: 75px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

}


/* =====================================================
   CURRENT WEATHER ICON
   ===================================================== */

.weather-icon {

    font-size: 22px;

    height: 22px;

    line-height: 22px;

    filter:
        drop-shadow(
            0 1px 2px
            rgba(0,0,0,0.3)
        );

}


/* =====================================================
   TEMPERATURE
   ===================================================== */

.temperature {

    font-size: 45px;

    font-weight: bold;

    line-height: 42px;

    text-shadow:
        0 2px 4px
        rgba(0,0,0,0.25);

}


/* =====================================================
   CONDITION
   ===================================================== */

.condition {

    font-size: 13px;

    font-weight: normal;

    line-height: 14px;

    margin-top: 1px;

    color:
        rgba(255,255,255,0.95);

}


/* =====================================================
   WEATHER DETAILS
   ===================================================== */

.details {

    margin-top: 3px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 16px;

    font-size: 10px;

    line-height: 11px;

    color:
        rgba(255,255,255,0.9);

}


.details strong {

    color: white;

}


/* =====================================================
   FORECAST
   ===================================================== */

.forecast {

    width: 100%;

    height: 72px;

    display: flex;

    gap: 5px;

}


/* =====================================================
   FORECAST CARD
   ===================================================== */

.day {

    flex: 1;

    min-width: 0;

    height: 72px;

    padding: 4px 2px;

    text-align: center;

    background:
        rgba(4,15,30,0.45);

    border:
        1px solid
        rgba(255,255,255,0.22);

    border-radius: 7px;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,0.18);

}


/* =====================================================
   FORECAST DAY
   ===================================================== */

.day-name {

    font-size: 12px;

    font-weight: bold;

    line-height: 13px;

}


/* =====================================================
   FORECAST ICON
   ===================================================== */

.day-icon {

    font-size: 20px;

    height: 21px;

    line-height: 21px;

    margin: 0;

}


/* =====================================================
   HIGH TEMP
   ===================================================== */

.high {

    font-size: 16px;

    font-weight: bold;

    line-height: 17px;

}


/* =====================================================
   LOW TEMP
   ===================================================== */

.low {

    font-size: 12px;

    font-weight: normal;

    line-height: 13px;

    color:
        rgba(255,255,255,0.82);

}


/* =====================================================
   RAIN CHANCE
   ===================================================== */

.rain {

    margin-top: 1px;

    font-size: 10px;

    font-weight: bold;

    line-height: 11px;

    color: #c7eaff;

}

</style>

</head>


<body>


<div class="screen">


    <!-- =================================================
         HEADER
         ================================================= -->

    <div class="header">


        <div>


            <div class="location">

                OSKALOOSA, IA

            </div>


            <div
                class="date"
                id="date">

                Loading...

            </div>


        </div>



        <div
            class="time"
            id="time">

            --:--

        </div>


    </div>



    <!-- =================================================
         CURRENT WEATHER
         ================================================= -->

    <div class="current">


        <div
            class="weather-icon"
            id="currentIcon">

            ⏳

        </div>



        <div
            class="temperature"
            id="temperature">

            --°

        </div>



        <div
            class="condition"
            id="condition">

            Loading weather...

        </div>



        <div class="details">


            <div>

                Feels

                <strong id="feels">

                    --°

                </strong>

            </div>



            <div>

                Humidity

                <strong id="humidity">

                    --%

                </strong>

            </div>



            <div>

                Wind

                <strong id="wind">

                    -- mph

                </strong>

            </div>


        </div>


    </div>



    <!-- =================================================
         FORECAST
         ================================================= -->

    <div
        class="forecast"
        id="forecast">

    </div>


</div>



<script>


/* =====================================================
   OSKALOOSA, IOWA

   Latitude:
   41.2964

   Longitude:
   -92.6444
   ===================================================== */


var LATITUDE = 41.2964;

var LONGITUDE = -92.6444;



/* =====================================================
   OPEN-METEO WEATHER API
   ===================================================== */


var WEATHER_URL =

    "https://api.open-meteo.com/v1/forecast" +

    "?latitude=" +
    LATITUDE +

    "&longitude=" +
    LONGITUDE +

    "&current=" +

    "temperature_2m," +

    "relative_humidity_2m," +

    "apparent_temperature," +

    "weather_code," +

    "wind_speed_10m" +

    "&daily=" +

    "weather_code," +

    "temperature_2m_max," +

    "temperature_2m_min," +

    "precipitation_probability_max" +

    "&temperature_unit=fahrenheit" +

    "&wind_speed_unit=mph" +

    "&timezone=America%2FChicago" +

    "&forecast_days=5";



/* =====================================================
   WEATHER INFORMATION
   ===================================================== */


function getWeatherInfo(code) {


    /* CLEAR */

    if (code === 0) {

        return {

            icon: "☀️",

            text: "Clear",

            background: "clear"

        };

    }



    /* PARTLY CLOUDY */

    if (
        code === 1 ||
        code === 2
    ) {

        return {

            icon: "🌤️",

            text: "Partly Cloudy",

            background: "partly-cloudy"

        };

    }



    /* CLOUDY */

    if (code === 3) {

        return {

            icon: "☁️",

            text: "Cloudy",

            background: "cloudy"

        };

    }



    /* FOG */

    if (
        code === 45 ||
        code === 48
    ) {

        return {

            icon: "🌫️",

            text: "Fog",

            background: "fog"

        };

    }



    /* DRIZZLE */

    if (
        code >= 51 &&
        code <= 57
    ) {

        return {

            icon: "🌦️",

            text: "Drizzle",

            background: "rain"

        };

    }



    /* RAIN */

    if (
        code >= 61 &&
        code <= 67
    ) {

        return {

            icon: "🌧️",

            text: "Rain",

            background: "rain"

        };

    }



    /* SNOW */

    if (
        code >= 71 &&
        code <= 77
    ) {

        return {

            icon: "❄️",

            text: "Snow",

            background: "snow"

        };

    }



    /* RAIN SHOWERS */

    if (
        code >= 80 &&
        code <= 82
    ) {

        return {

            icon: "🌦️",

            text: "Rain Showers",

            background: "rain"

        };

    }



    /* THUNDERSTORM */

    if (code >= 95) {

        return {

            icon: "⛈️",

            text: "Thunderstorm",

            background: "storm"

        };

    }



    /* DEFAULT */

    return {

        icon: "🌤️",

        text: "Weather",

        background: "partly-cloudy"

    };

}



/* =====================================================
   CHANGE BACKGROUND
   ===================================================== */


function setWeatherBackground(weather) {


    document.body.className =
        weather.background;

}



/* =====================================================
   FORMAT DATE
   ===================================================== */


function formatDate(dateString) {


    var date =

        new Date(
            dateString +
            "T12:00:00"
        );


    return date.toLocaleDateString(

        "en-US",

        {

            weekday: "long",

            month: "long",

            day: "numeric"

        }

    );

}



/* =====================================================
   FORMAT FORECAST DAY
   ===================================================== */


function formatDay(
    dateString,
    index
) {


    if (index === 0) {

        return "TODAY";

    }


    var date =

        new Date(
            dateString +
            "T12:00:00"
        );


    return date.toLocaleDateString(

        "en-US",

        {

            weekday: "short"

        }

    ).toUpperCase();

}



/* =====================================================
   CLOCK
   ===================================================== */


function updateClock() {


    var now = new Date();


    document.getElementById(
        "time"
    ).textContent =


        now.toLocaleTimeString(

            "en-US",

            {

                hour: "numeric",

                minute: "2-digit"

            }

        );

}



/* =====================================================
   LOAD WEATHER
   ===================================================== */


function loadWeather() {


    fetch(WEATHER_URL)


        .then(
            function(response) {


                if (!response.ok) {

                    throw new Error(
                        "Weather request failed"
                    );

                }


                return response.json();

            }
        )


        .then(
            function(data) {


                /* =====================================
                   CURRENT CONDITIONS
                   ===================================== */


                var current =
                    data.current;


                var weather =
                    getWeatherInfo(
                        current.weather_code
                    );



                /* =====================================
                   CHANGE BACKGROUND
                   ===================================== */


                setWeatherBackground(
                    weather
                );



                /* =====================================
                   TEMPERATURE
                   ===================================== */


                document.getElementById(
                    "temperature"
                ).textContent =


                    Math.round(
                        current.temperature_2m
                    ) +

                    "°";



                /* =====================================
                   ICON
                   ===================================== */


                document.getElementById(
                    "currentIcon"
                ).textContent =

                    weather.icon;



                /* =====================================
                   CONDITION
                   ===================================== */


                document.getElementById(
                    "condition"
                ).textContent =

                    weather.text;



                /* =====================================
                   FEELS LIKE
                   ===================================== */


                document.getElementById(
                    "feels"
                ).textContent =


                    Math.round(
                        current.apparent_temperature
                    ) +

                    "°";



                /* =====================================
                   HUMIDITY
                   ===================================== */


                document.getElementById(
                    "humidity"
                ).textContent =


                    Math.round(
                        current.relative_humidity_2m
                    ) +

                    "%";



                /* =====================================
                   WIND
                   ===================================== */


                document.getElementById(
                    "wind"
                ).textContent =


                    Math.round(
                        current.wind_speed_10m
                    ) +

                    " mph";



                /* =====================================
                   DATE
                   ===================================== */


                document.getElementById(
                    "date"
                ).textContent =


                    formatDate(
                        data.daily.time[0]
                    );



                /* =====================================
                   FORECAST
                   ===================================== */


                var forecast =

                    document.getElementById(
                        "forecast"
                    );


                forecast.innerHTML = "";



                for (

                    var i = 0;

                    i <
                    data.daily.time.length;

                    i++

                ) {


                    var forecastWeather =

                        getWeatherInfo(

                            data.daily
                            .weather_code[i]

                        );



                    var card =

                        document.createElement(
                            "div"
                        );


                    card.className =
                        "day";



                    card.innerHTML =


                        '<div class="day-name">' +

                        formatDay(

                            data.daily.time[i],

                            i

                        ) +

                        '</div>' +



                        '<div class="day-icon">' +

                        forecastWeather.icon +

                        '</div>' +



                        '<div class="high">' +

                        Math.round(

                            data.daily
                            .temperature_2m_max[i]

                        ) +

                        "°" +

                        '</div>' +



                        '<div class="low">' +

                        Math.round(

                            data.daily
                            .temperature_2m_min[i]

                        ) +

                        "°" +

                        '</div>' +



                        '<div class="rain">' +

                        "Rain " +

                        Math.round(

                            data.daily
                            .precipitation_probability_max[i]

                        ) +

                        "%" +

                        '</div>';



                    forecast.appendChild(
                        card
                    );


                }


            }
        )


        .catch(
            function(error) {


                console.log(error);


                document.getElementById(
                    "condition"
                ).textContent =

                    "Unable to load weather";


            }
        );

}



/* =====================================================
   START
   ===================================================== */


updateClock();

loadWeather();



/* =====================================================
   CLOCK UPDATE
   ===================================================== */


setInterval(

    updateClock,

    1000

);



/* =====================================================
   WEATHER UPDATE
   ===================================================== */

setInterval(

    loadWeather,

    15 * 60 * 1000

);


</script>


</body>

</html>
